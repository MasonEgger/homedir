---
# ABOUTME: Per-user tool installs via curl scripts and npm.
# Installs Oh My Zsh, Claude Code CLI, uv, Node (via nvm), the Todoist CLI, and
# pnpm into the target user's home directory. Node comes from nvm, not apt.

# Target-user variants run via `runuser -l`, not `su -`: su's PAM account
# stack enforces the password expiry that user.yml sets with chage -d 0, so
# every su would fail on a re-run until the user logs in. runuser skips it.
# Oh My Zsh
- name: Install Oh My Zsh (target user)
  ansible.builtin.shell: >-
    runuser -l {{ target_user }} -s /bin/sh -c
    'sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended'
  args:
    creates: "{{ target_home }}/.oh-my-zsh"
  become: true
  when: target_user is defined and not ansible_check_mode
  tags: user-tools

- name: Install Oh My Zsh (current user)
  ansible.builtin.shell: >
    sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  args:
    creates: "{{ target_home }}/.oh-my-zsh"
  when: target_user is not defined and not ansible_check_mode
  tags: user-tools

# Claude Code CLI
# No versioned installer URL available, so this always installs latest.
# The installer symlinks ~/.local/bin/claude to the versioned binary.
- name: Check if Claude Code CLI is installed
  ansible.builtin.stat:
    path: "{{ target_home }}/.local/bin/claude"
  register: claude_cli_check
  tags: user-tools

- name: Install Claude Code CLI (target user)
  ansible.builtin.shell: >-
    runuser -l {{ target_user }} -s /bin/bash -c 'curl -fsSL https://claude.ai/install.sh | bash'
  become: true
  changed_when: true
  when: target_user is defined and not claude_cli_check.stat.exists and not ansible_check_mode
  tags: user-tools

- name: Install Claude Code CLI (current user)
  ansible.builtin.shell: curl -fsSL https://claude.ai/install.sh | bash
  changed_when: true
  when: target_user is not defined and not claude_cli_check.stat.exists and not ansible_check_mode
  tags: user-tools

# uv Python package manager (installs to ~/.local/bin which isn't in Ansible's PATH)
- name: Check if uv is installed
  ansible.builtin.stat:
    path: "{{ target_home }}/.local/bin/uv"
  register: uv_check
  tags: user-tools

- name: Install uv Python package manager (target user)
  ansible.builtin.shell: >-
    runuser -l {{ target_user }} -s /bin/bash -c 'curl -LsSf https://astral.sh/uv/install.sh | sh'
  become: true
  changed_when: true
  when: target_user is defined and not uv_check.stat.exists and not ansible_check_mode
  tags: user-tools

- name: Install uv Python package manager (current user)
  ansible.builtin.shell: curl -LsSf https://astral.sh/uv/install.sh | sh
  changed_when: true
  when: target_user is not defined and not uv_check.stat.exists and not ansible_check_mode
  tags: user-tools

# Node.js via nvm (official install path), NOT apt. Distro node lags hard:
# Ubuntu ships node 18, but the Todoist CLI needs node >=24. macOS gets a
# current node from the brew `node` package, so nvm is Ubuntu/Debian only.
# nvm lives under ~/.nvm and its prefix is user-writable, so `npm install -g`
# needs no sudo and no prefix override.
- name: Ensure nvm + Node LTS (target user, Ubuntu/Debian)
  ansible.builtin.shell: >-
    runuser -l {{ target_user }} -s /bin/bash -c '
    export NVM_DIR="$HOME/.nvm";
    if [ ! -s "$NVM_DIR/nvm.sh" ]; then git clone --depth 1 --branch v0.40.1 https://github.com/nvm-sh/nvm.git "$NVM_DIR" && echo NVM_CHANGED; fi;
    . "$NVM_DIR/nvm.sh";
    if ! nvm which "lts/*" >/dev/null 2>&1; then nvm install --lts && nvm alias default "lts/*" && echo NVM_CHANGED; fi'
  become: true
  register: nvm_target_result
  changed_when: "'NVM_CHANGED' in nvm_target_result.stdout"
  when: target_user is defined and ansible_facts['os_family'] == "Debian" and not ansible_check_mode
  tags: user-tools

- name: Ensure nvm + Node LTS (current user, Ubuntu/Debian)
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    if [ ! -s "$NVM_DIR/nvm.sh" ]; then
      git clone --depth 1 --branch v0.40.1 https://github.com/nvm-sh/nvm.git "$NVM_DIR" && echo NVM_CHANGED
    fi
    . "$NVM_DIR/nvm.sh"
    if ! nvm which "lts/*" >/dev/null 2>&1; then
      nvm install --lts && nvm alias default 'lts/*' && echo NVM_CHANGED
    fi
  args:
    executable: /bin/bash
  register: nvm_current_result
  changed_when: "'NVM_CHANGED' in nvm_current_result.stdout"
  when: target_user is not defined and ansible_facts['os_family'] == "Debian" and not ansible_check_mode
  tags: user-tools

# Source nvm in the interactive shell so `td`/`todo` (installed under nvm's
# node) resolve. nvm is OS-specific, so this goes in ~/.zshrc.local (durable,
# never clobbered by the .zshrc copy) rather than the cross-OS tracked .zshrc.
- name: Source nvm from ~/.zshrc.local (Ubuntu/Debian)
  ansible.builtin.blockinfile:
    path: "{{ target_home }}/.zshrc.local"
    marker: "# {mark} ANSIBLE MANAGED nvm"
    create: true
    mode: "0644"
    owner: "{{ target_user | default(omit) }}"
    group: "{{ target_user | default(omit) }}"
    block: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
  become: "{{ target_user is defined }}"
  when: ansible_facts['os_family'] == "Debian"
  tags: user-tools

# Todoist CLI (official Doist npm package), installed under nvm's node.
# Guard on the npm package, not `command -v td`: `td` collides with the
# `td=tmux detach` shell alias, so a name check can false-positive and skip
# the install. Querying npm's global list checks the actual package.
# The checks below run as the Ansible user (root in the target-user flow), so
# NVM_DIR must point at target_home explicitly rather than $HOME.
- name: Check if Todoist CLI is installed
  ansible.builtin.shell: |
    export NVM_DIR="{{ target_home }}/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" && nvm use --lts >/dev/null 2>&1
    npm ls -g --depth=0 @doist/todoist-cli
  args:
    executable: /bin/bash
  register: todoist_cli_check
  changed_when: false
  failed_when: false
  tags: user-tools

- name: Install Todoist CLI (target user)
  ansible.builtin.shell: >-
    runuser -l {{ target_user }} -s /bin/bash -c '
    export NVM_DIR="$HOME/.nvm";
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" && nvm use --lts >/dev/null;
    npm install -g @doist/todoist-cli'
  become: true
  changed_when: true
  when: target_user is defined and todoist_cli_check.rc != 0 and not ansible_check_mode
  tags: user-tools

- name: Install Todoist CLI (current user)
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" && nvm use --lts >/dev/null
    npm install -g @doist/todoist-cli
  args:
    executable: /bin/bash
  changed_when: true
  when: target_user is not defined and todoist_cli_check.rc != 0 and not ansible_check_mode
  tags: user-tools

# pnpm via corepack (bundled with Node), enabled under nvm's node.
# Required by the slidev Claude Code skill and any other pnpm-based workflows
- name: Check if pnpm is installed
  ansible.builtin.shell: |
    export NVM_DIR="{{ target_home }}/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" && nvm use --lts >/dev/null 2>&1
    command -v pnpm
  args:
    executable: /bin/bash
  register: pnpm_check
  changed_when: false
  failed_when: false
  tags: user-tools

- name: Enable pnpm via corepack (target user)
  ansible.builtin.shell: >-
    runuser -l {{ target_user }} -s /bin/bash -c '
    export NVM_DIR="$HOME/.nvm";
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" && nvm use --lts >/dev/null;
    corepack enable pnpm && corepack prepare pnpm@latest --activate'
  become: true
  changed_when: true
  when: target_user is defined and pnpm_check.rc != 0 and not ansible_check_mode
  tags: user-tools

- name: Enable pnpm via corepack (current user)
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" && nvm use --lts >/dev/null
    corepack enable pnpm && corepack prepare pnpm@latest --activate
  args:
    executable: /bin/bash
  changed_when: true
  when: target_user is not defined and pnpm_check.rc != 0 and not ansible_check_mode
  tags: user-tools
