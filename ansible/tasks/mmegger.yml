---
# ABOUTME: Full mmegger user setup on Debian/Ubuntu systems.
# Installs system packages, then wraps user.yml with mmegger-specific values.

# =============================================================================
# System packages (runs as root, no user needed)
# =============================================================================

- name: Include package management tasks for mmegger
  ansible.builtin.include_tasks:
    file: packages.yml
    apply:
      tags: mmegger
  vars:
    target_home: /home/mmegger
  tags: mmegger

- name: Include Obsidian tasks for mmegger
  ansible.builtin.include_tasks:
    file: obsidian.yml
    apply:
      tags: mmegger
  tags: mmegger

- name: Include Tailscale tasks for mmegger
  ansible.builtin.include_tasks:
    file: tailscale.yml
    apply:
      tags: mmegger
  tags: mmegger

# =============================================================================
# User creation, SSH, and per-user configs (parameterized in user.yml)
# =============================================================================

- name: Include parameterized user setup for mmegger
  ansible.builtin.include_tasks:
    file: user.yml
    apply:
      tags: mmegger
  vars:
    new_user_name: mmegger
    new_user_email: mason@masonegger.com
  tags: mmegger
