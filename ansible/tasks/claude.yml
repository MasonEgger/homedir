---
# .claude Directory Installation — COPY strategy with stale-file cleanup.
#
# The repo is the source of truth for most of the .claude tree. Every deploy:
#   1. Replaces ~/.claude/CLAUDE.md with the repo copy.
#   2. WIPES ~/.claude/rules/ and re-copies it from the repo, so any file
#      that no longer exists in the repo (e.g. error-handling.md after the
#      consolidation refactor) is removed from live.
#   3. MERGES ~/.claude/settings.json: repo-managed keys are written from the
#      repo, but the machine-local keys (model, theme, skipWorkflowUsageWarning,
#      enabledPlugins, extraKnownMarketplaces) are preserved from the live file.
#      See the settings.json tasks below.
#
# Ad-hoc edits to CLAUDE.md and rules/ between deploys are lost on the next
# run: that is the design. For settings.json, only the machine-local keys above
# survive; repo-managed keys are overwritten. To persist a repo-managed change,
# make it in the repo and commit.
#
# Per-machine runtime files (history.jsonl, backups/, cache/, file-history/,
# .credentials.json, .last-update-result.json, settings.local.json) are NOT
# touched. Only the three tracked entries above.
#
# Migration: if a prior deploy created symlinks at the tracked-entry paths
# (e.g. the brief 0.x experiment with `state: link`), the first task below
# removes them so the subsequent copy tasks do not follow the symlink and
# write back into the repo.
- name: Check if .claude directory exists in dotfiles
  ansible.builtin.stat:
    path: "{{ dotfiles_dir }}/.claude"
  register: claude_dir
  tags: claude

- name: Ensure live ~/.claude/ exists
  ansible.builtin.file:
    path: "{{ target_home }}/.claude"
    state: directory
    mode: '0755'
    owner: "{{ target_user | default(omit) }}"
    group: "{{ target_user | default(omit) }}"
  when: claude_dir.stat.exists
  become: "{{ target_user is defined }}"
  tags: claude

- name: Inspect tracked entries (detect leftover symlinks)
  ansible.builtin.stat:
    path: "{{ target_home }}/.claude/{{ item }}"
    follow: false
  register: claude_entry_stats
  loop:
    - CLAUDE.md
    - rules
    - settings.json
  when: claude_dir.stat.exists
  tags: claude

- name: Remove any symlinked tracked entries (so copy does not follow them)
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ claude_entry_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - claude_dir.stat.exists
    - item.stat.exists | default(false)
    - item.stat.islnk | default(false)
  become: "{{ target_user is defined }}"
  tags: claude

- name: Wipe live ~/.claude/rules/ (will be re-copied from repo below)
  ansible.builtin.file:
    path: "{{ target_home }}/.claude/rules"
    state: absent
  when: claude_dir.stat.exists
  become: "{{ target_user is defined }}"
  tags: claude

- name: Install ~/.claude/CLAUDE.md from repo
  ansible.builtin.copy:
    src: "{{ dotfiles_dir }}/.claude/CLAUDE.md"
    dest: "{{ target_home }}/.claude/CLAUDE.md"
    mode: '0644'
    owner: "{{ target_user | default(omit) }}"
    group: "{{ target_user | default(omit) }}"
    backup: false
  when: claude_dir.stat.exists
  become: "{{ target_user is defined }}"
  tags: claude

- name: Install ~/.claude/rules/ from repo
  ansible.builtin.copy:
    src: "{{ dotfiles_dir }}/.claude/rules/"
    dest: "{{ target_home }}/.claude/rules/"
    mode: '0644'
    directory_mode: '0755'
    owner: "{{ target_user | default(omit) }}"
    group: "{{ target_user | default(omit) }}"
    backup: false
  when: claude_dir.stat.exists
  become: "{{ target_user is defined }}"
  tags: claude

# settings.json is MERGED, not overwritten. The repo owns most keys, but these
# are machine-local and must survive every deploy. The repo copy still supplies
# them as bootstrap defaults on a fresh machine (no live file), but never
# overwrites an existing live value:
#   model                    - the user's /model choice
#   theme                    - per-machine appearance
#   skipWorkflowUsageWarning - per-machine UX flag
#   enabledPlugins           - owned by the claude-plugins script
#   extraKnownMarketplaces   - owned by the claude-plugins script
- name: Read the live ~/.claude/settings.json if it exists
  ansible.builtin.slurp:
    src: "{{ target_home }}/.claude/settings.json"
  register: claude_settings_live_raw
  failed_when: false
  when: claude_dir.stat.exists
  become: "{{ target_user is defined }}"
  tags: claude

- name: Extract the machine-local keys to preserve across the deploy
  ansible.builtin.set_fact:
    claude_settings_local: >-
      {{
        ((claude_settings_live_raw.content | b64decode | from_json)
          if claude_settings_live_raw.content is defined else {})
        | dict2items
        | selectattr('key', 'in', claude_settings_machine_local_keys)
        | items2dict
      }}
  vars:
    claude_settings_machine_local_keys:
      - model
      - theme
      - skipWorkflowUsageWarning
      - enabledPlugins
      - extraKnownMarketplaces
  when: claude_dir.stat.exists
  tags: claude

- name: Install ~/.claude/settings.json (repo baseline, machine-local keys preserved)
  ansible.builtin.copy:
    content: >-
      {{ (lookup('file', dotfiles_dir ~ '/.claude/settings.json') | from_json
          | combine(claude_settings_local)) | to_nice_json(indent=2) }}
    dest: "{{ target_home }}/.claude/settings.json"
    mode: '0644'
    owner: "{{ target_user | default(omit) }}"
    group: "{{ target_user | default(omit) }}"
    backup: true
  when: claude_dir.stat.exists
  become: "{{ target_user is defined }}"
  tags: claude

# runuser, not su: su enforces the chage -d 0 password expiry and fails on
# re-runs. Login shell via bash, not the user's zsh: a non-interactive zsh login shell
# skips .zshrc, so ~/.local/bin (uv, claude) would be missing from PATH.
# changed_when keys on the script's own report lines: ": installed",
# ": updated", ": uninstalled", ": removed" mark real changes, while
# "up to date" and "refreshed from source" are no-ops.
- name: Install Claude Code plugins (target user)
  ansible.builtin.shell: >-
    runuser -l {{ target_user }} -s /bin/bash -c
    'PATH="$HOME/.local/bin:$PATH" {{ target_home }}/.homedir/claude-plugins'
  when: target_user is defined
  become: true
  register: claude_plugins_target
  changed_when: >-
    claude_plugins_target.stdout is search(': (installed|updated|uninstalled|removed)')
  tags: claude

- name: Install Claude Code plugins (current user)
  ansible.builtin.command: "{{ dotfiles_dir }}/.homedir/claude-plugins"
  when: target_user is not defined
  register: claude_plugins_current
  changed_when: >-
    claude_plugins_current.stdout is search(': (installed|updated|uninstalled|removed)')
  tags: claude
